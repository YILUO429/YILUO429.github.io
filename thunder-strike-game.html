<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>雷霆战机 | Thunder Strike</title>
<style>
  :root {
    --bg: #050505;
    --bg-secondary: #0d0d0d;
    --fg: #e0e0e0;
    --accent: #76b900;
    --accent-glow: #a4e400;
    --accent-dim: #4a7500;
    --danger: #ff3b3b;
    --warning: #ffaa00;
    --border: #1a1a1a;
    --muted: #666;
    --cyan: #00d4ff;
    --purple: #a855f7;
    --gold: #ffd700;
    --silver: #c0c0c0;
    --bronze: #cd7f32;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Courier New', 'Menlo', monospace;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game-container {
    position: relative;
    width: 100vw; height: 100vh;
    max-width: 500px;
    margin: 0 auto;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 80%, #0d1a00 0%, #050505 70%);
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
  }
  /* HUD overlay */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }
  .hud-item {
    display: flex; flex-direction: column; align-items: center;
  }
  .hud-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .hud-value {
    font-size: 22px;
    font-weight: bold;
    color: var(--accent-glow);
    text-shadow: 0 0 12px var(--accent);
  }
  .hud-value.danger { color: var(--danger); text-shadow: 0 0 12px var(--danger); }
  /* Health bar */
  #health-bar-wrap {
    position: absolute;
    bottom: 10px; left: 10px; right: 10px;
    height: 3px;
    background: #1a1a1a;
    border-radius: 2px;
    overflow: hidden;
    pointer-events: none;
    z-index: 10;
  }
  #health-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent-glow));
    transition: width 0.3s ease;
    border-radius: 2px;
  }
  #health-bar.critical {
    background: linear-gradient(90deg, #8b0000, var(--danger));
    animation: pulse-bar 0.4s ease-in-out infinite;
  }
  @keyframes pulse-bar { 50% { opacity: 0.5; } }
  /* Overlay screens */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.85);
    z-index: 20;
    transition: opacity 0.3s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay-title {
    font-size: 36px;
    font-weight: bold;
    color: var(--accent-glow);
    text-shadow: 0 0 30px var(--accent), 0 0 60px var(--accent);
    letter-spacing: 6px;
    margin-bottom: 8px;
    animation: glow 2s ease-in-out infinite;
  }
  @keyframes glow { 50% { text-shadow: 0 0 40px var(--accent), 0 0 80px var(--accent); } }
  .overlay-subtitle {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 4px;
    margin-bottom: 40px;
  }
  .btn {
    padding: 14px 48px;
    font-size: 16px;
    font-weight: bold;
    font-family: inherit;
    letter-spacing: 3px;
    color: var(--bg);
    background: var(--accent);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    position: relative;
    outline: none;
  }
  .btn:hover {
    background: var(--accent-glow);
    box-shadow: 0 0 30px var(--accent);
  }
  .btn:active { transform: scale(0.95); }
  .overlay-score {
    font-size: 48px;
    font-weight: bold;
    color: #fff;
    margin-bottom: 4px;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
  }
  .overlay-best {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .overlay-best span { color: var(--accent-glow); }
  /* Mobile hint */
  .hint {
    position: absolute;
    bottom: 60px; left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    pointer-events: none;
    z-index: 10;
    animation: fade-hint 2s ease-in-out infinite;
  }
  @keyframes fade-hint { 50% { opacity: 0.4; } }

  /* ─── Nickname Input ────────────── */
  .nickname-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    margin-bottom: 20px;
  }
  .nickname-wrap label {
    font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px;
  }
  .nickname-input {
    background: #0a0a0a; border: 1px solid var(--border); color: var(--accent-glow);
    font-family: inherit; font-size: 14px; padding: 8px 14px; text-align: center;
    border-radius: 2px; outline: none; width: 200px; letter-spacing: 1px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .nickname-input:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-dim); }
  .nickname-input::placeholder { color: #333; }

  /* ─── Leaderboard ───────────────── */
  .lb-wrap {
    width: 100%; max-width: 360px; margin-top: 2px;
    max-height: 210px; overflow-y: auto;
    padding: 0 14px;
  }
  .lb-wrap::-webkit-scrollbar { width: 4px; }
  .lb-wrap::-webkit-scrollbar-track { background: #0a0a0a; }
  .lb-wrap::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 2px; }
  .lb-title {
    font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 3px;
    text-align: center; margin-bottom: 10px; padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .lb-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .lb-table th {
    color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: 2px;
    padding: 4px 6px; border-bottom: 1px solid var(--border); font-weight: normal;
  }
  .lb-table td {
    padding: 5px 6px; color: #ccc; border-bottom: 1px solid rgba(26,26,26,0.5);
    text-align: center;
  }
  .lb-table .rank-1 { color: var(--gold); font-weight: bold; text-shadow: 0 0 8px rgba(255,215,0,0.5); }
  .lb-table .rank-2 { color: var(--silver); font-weight: bold; text-shadow: 0 0 6px rgba(192,192,192,0.5); }
  .lb-table .rank-3 { color: var(--bronze); font-weight: bold; text-shadow: 0 0 6px rgba(205,127,50,0.5); }
  .lb-table .you td { color: var(--accent-glow); font-weight: bold; background: rgba(118,185,0,0.06); }
  .lb-table td:nth-child(1) { width: 32px; }
  .lb-table td:nth-child(2) { text-align: left; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-table td:nth-child(3) { width: 70px; font-variant-numeric: tabular-nums; }
  .lb-table td:nth-child(4) { width: 40px; }
  .lb-empty {
    text-align: center; color: var(--muted); font-size: 11px; padding: 20px 0;
    letter-spacing: 1px;
  }
  .lb-rank-info {
    text-align: center; color: var(--muted); font-size: 10px; margin-top: 8px;
    padding-top: 8px; border-top: 1px solid rgba(26,26,26,0.5);
    letter-spacing: 1px;
  }

  /* ─── Start-screen Leaderboard Toggle ── */
  .lb-toggle-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    font-family: inherit; font-size: 10px; padding: 6px 16px; cursor: pointer;
    letter-spacing: 2px; border-radius: 2px; transition: all 0.2s;
    margin-top: 6px; text-transform: uppercase;
  }
  .lb-toggle-btn:hover { border-color: var(--accent); color: var(--accent-glow); }
  .start-lb-wrap {
    width: 100%; max-width: 340px; max-height: 160px; overflow-y: auto;
    margin-top: 10px; padding: 0 8px;
    transition: max-height 0.3s ease, opacity 0.3s ease;
  }
  .start-lb-wrap.collapsed { max-height: 0; opacity: 0; overflow: hidden; }
  .start-lb-wrap::-webkit-scrollbar { width: 4px; }
  .start-lb-wrap::-webkit-scrollbar-track { background: #0a0a0a; }
  .start-lb-wrap::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 2px; }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>
  <!-- HUD -->
  <div id="hud">
    <div class="hud-item">
      <span class="hud-label">SCORE</span>
      <span class="hud-value" id="score-display">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">WAVE</span>
      <span class="hud-value" id="wave-display">1</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">COMBO</span>
      <span class="hud-value" id="combo-display" style="font-size:16px;color:var(--cyan)">x1</span>
    </div>
  </div>
  <div id="health-bar-wrap"><div id="health-bar" style="width:100%"></div></div>
  <div class="hint" id="hint">拖动屏幕控制战机</div>

  <!-- Start overlay -->
  <div class="overlay" id="start-overlay">
    <div class="overlay-title">雷霆战机</div>
    <div class="overlay-subtitle">THUNDER STRIKE</div>
    <div class="nickname-wrap">
      <label>飞行员代号</label>
      <input class="nickname-input" id="nickname-input" placeholder="输入你的代号" maxlength="12" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <button class="btn" id="btn-start" onclick="game.start()">START</button>
    <button class="lb-toggle-btn" id="lb-toggle" onclick="toggleStartLB()">🏆 排行榜 ▾</button>
    <div class="start-lb-wrap collapsed" id="start-lb-container"></div>
  </div>

  <!-- Game Over overlay -->
  <div class="overlay hidden" id="gameover-overlay">
    <div class="overlay-title" style="font-size:28px;text-shadow:0 0 30px var(--danger),0 0 60px var(--danger);color:var(--danger);">GAME OVER</div>
    <div class="overlay-score" id="final-score">0</div>
    <div class="overlay-best">BEST <span id="best-score">0</span></div>
    <div class="lb-title">🏆 排行榜 TOP 10</div>
    <div class="lb-wrap" id="lb-container"></div>
    <button class="btn" id="btn-retry" onclick="game.restart()" style="margin-top:14px;">RETRY</button>
  </div>
</div>

<script>
// ──────────────────────────────────
//  Thunder Strike — 雷霆战机
//  NVIDIA 暗黑 + 霓虹绿风格
// ──────────────────────────────────

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ─── Resize ───────────────────────
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const maxW = 500;
  const scale = Math.min(w / maxW, 1);
  canvas.width = Math.floor(maxW * window.devicePixelRatio);
  canvas.height = Math.floor(h * window.devicePixelRatio);
  canvas.style.width = maxW * scale + 'px';
  canvas.style.height = h * scale + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  return { w: canvas.width / window.devicePixelRatio, h: canvas.height / window.devicePixelRatio };
}
let CW, CH;
function updateSize() { const s = resize(); CW = s.w; CH = s.h; }
window.addEventListener('resize', updateSize);
window.addEventListener('orientationchange', () => setTimeout(updateSize, 100));
updateSize();

// ─── Audio (minimal — oscillator beeps) ─
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq, dur, type = 'square', vol = 0.05) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}

// ─── Particles ────────────────────
const particles = [];
function spawnParticles(x, y, count, color, speed = 2, life = 30) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = (Math.random() * 0.7 + 0.3) * speed;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life, maxLife: life,
      size: Math.random() * 3 + 1.5,
      color,
    });
  }
}
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) { particles.splice(i, 1); }
  }
}
function drawParticles(ctx) {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6 * alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

// ─── Stars (background) ───────────
const stars = [];
function initStars() {
  stars.length = 0;
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * CW,
      y: Math.random() * CH,
      size: Math.random() * 1.5 + 0.5,
      speed: Math.random() * 2 + 0.5,
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: Math.random() * 0.05 + 0.01,
    });
  }
}
function updateStars() {
  for (const s of stars) {
    s.y += s.speed;
    s.twinkle += s.twinkleSpeed;
    if (s.y > CH + 5) { s.y = -5; s.x = Math.random() * CW; }
  }
}
function drawStars(ctx) {
  for (const s of stars) {
    const alpha = 0.3 + Math.sin(s.twinkle) * 0.3 + 0.3;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#76b900';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ─── Bullets ──────────────────────
const bullets = [];
const BULLET_SPEED = 10;
function spawnBullet(x, y, angle = -Math.PI / 2, speed = BULLET_SPEED, type = 'normal') {
  bullets.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, type, life: 120 });
}
function updateBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.y < -20 || b.y > CH + 20 || b.x < -20 || b.x > CW + 20 || b.life <= 0) {
      bullets.splice(i, 1);
    }
  }
}
function drawBullets(ctx) {
  for (const b of bullets) {
    ctx.fillStyle = b.type === 'power' ? '#00d4ff' : '#a4e400';
    ctx.shadowColor = b.type === 'power' ? '#00d4ff' : '#76b900';
    ctx.shadowBlur = 8;
    ctx.fillRect(b.x - 1.5, b.y - 6, 3, 12);
    ctx.shadowBlur = 0;
    // trail
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = b.type === 'power' ? '#00d4ff' : '#76b900';
    ctx.fillRect(b.x - 0.8, b.y - 3, 1.6, 6);
    ctx.globalAlpha = 1;
  }
}

// ─── Player ───────────────────────
const player = {
  x: 0, y: 0,
  width: 36, height: 44,
  speed: 8,
  health: 100,
  maxHealth: 100,
  invincible: 0,
  powerMode: 0,
  shieldActive: false,
  shootTimer: 0,
  shootInterval: 12, // frames between shots
  powerLevel: 1,
};

function drawPlayer(ctx) {
  if (player.invincible > 0 && Math.floor(player.invincible / 3) % 2 === 0) return;
  const { x, y, width: w, height: h } = player;

  ctx.save();
  ctx.translate(x, y);

  // Shield glow
  if (player.shieldActive) {
    ctx.strokeStyle = '#a855f7';
    ctx.shadowColor = '#a855f7';
    ctx.shadowBlur = 16;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, w * 0.8, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // Engine glow
  const engineGlow = ctx.createRadialGradient(0, h / 2 + 2, 2, 0, h / 2 + 8, 14);
  engineGlow.addColorStop(0, 'rgba(164,228,0,0.9)');
  engineGlow.addColorStop(0.5, 'rgba(118,185,0,0.4)');
  engineGlow.addColorStop(1, 'rgba(118,185,0,0)');
  ctx.fillStyle = engineGlow;
  ctx.beginPath();
  ctx.moveTo(-8, h / 2 - 2);
  ctx.lineTo(8, h / 2 - 2);
  ctx.lineTo(0, h / 2 + 16 + Math.random() * 4);
  ctx.fill();

  // Ship body — angular NVIDIA style
  ctx.fillStyle = '#1a1a1a';
  ctx.strokeStyle = '#76b900';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#76b900';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  // Main body
  ctx.moveTo(0, -h / 2);
  ctx.lineTo(-w / 2, h / 2);
  ctx.lineTo(-w / 4, h / 4);
  ctx.lineTo(w / 4, h / 4);
  ctx.lineTo(w / 2, h / 2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Cockpit
  ctx.fillStyle = '#76b900';
  ctx.shadowColor = '#a4e400';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.moveTo(0, -h / 4);
  ctx.lineTo(-5, 4);
  ctx.lineTo(5, 4);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  // Wing accents
  ctx.strokeStyle = '#a4e400';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-w / 2 + 6, h / 2 - 6);
  ctx.lineTo(-w / 4, h / 4);
  ctx.moveTo(w / 2 - 6, h / 2 - 6);
  ctx.lineTo(w / 4, h / 4);
  ctx.stroke();

  ctx.restore();
}

// ─── Enemies ──────────────────────
const enemies = [];
const ENEMY_TYPES = {
  scout: { w: 24, h: 24, hp: 1, speed: 2.5, score: 10, color: '#76b900' },
  fighter: { w: 30, h: 32, hp: 2, speed: 2.0, score: 25, color: '#ffaa00', canShoot: true, shootInterval: 90 },
  heavy: { w: 40, h: 46, hp: 5, speed: 1.2, score: 50, color: '#ff3b3b' },
  boss: { w: 64, h: 70, hp: 30, speed: 0.8, score: 500, color: '#ff3b3b', canShoot: true, shootInterval: 40, isBoss: true },
};

const enemyBullets = [];

function spawnEnemy(type = 'scout') {
  const t = ENEMY_TYPES[type];
  const e = {
    x: t.w / 2 + Math.random() * (CW - t.w),
    y: -t.h,
    width: t.w, height: t.h,
    hp: t.hp, maxHp: t.hp,
    speed: t.speed * (1 + game.wave * 0.08),
    score: t.score,
    color: t.color,
    type,
    canShoot: t.canShoot || false,
    shootInterval: t.shootInterval || 0,
    shootTimer: Math.floor(Math.random() * (t.shootInterval || 60)),
    isBoss: t.isBoss || false,
    phase: 0,
    phaseTimer: 0,
  };
  enemies.push(e);
  return e;
}

function spawnWave() {
  const wave = game.wave;

  // Scouts
  const scoutCount = Math.min(3 + wave, 10);
  for (let i = 0; i < scoutCount; i++) {
    setTimeout(() => spawnEnemy('scout'), i * (300 - wave * 10));
  }

  // Fighters
  const fighterCount = Math.min(1 + Math.floor(wave / 2), 5);
  for (let i = 0; i < fighterCount; i++) {
    setTimeout(() => spawnEnemy('fighter'), 800 + i * 500);
  }

  // Heavies
  const heavyCount = Math.min(Math.floor(wave / 3), 4);
  for (let i = 0; i < heavyCount; i++) {
    setTimeout(() => spawnEnemy('heavy'), 1500 + i * 800);
  }

  // Boss every 5 waves
  if (wave % 5 === 0 && wave > 0) {
    setTimeout(() => spawnEnemy('boss'), 2000);
  }
}

function updateEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.speed;

    // Boss movement pattern
    if (e.isBoss) {
      e.phaseTimer++;
      if (e.phaseTimer < 120) { /* enter */ }
      else {
        e.x += Math.sin(e.phaseTimer * 0.03) * 2;
      }
      if (e.y > 80) e.y = 80 + Math.sin(e.phaseTimer * 0.02) * 20;
    }

    // Shooting
    if (e.canShoot) {
      e.shootTimer--;
      if (e.shootTimer <= 0) {
        e.shootTimer = e.shootInterval;
        if (e.y > 0 && e.y < CH * 0.8) {
          const angle = Math.atan2(player.y - e.y, player.x - e.x);
          enemyBullets.push({
            x: e.x, y: e.y + e.height / 2,
            vx: Math.cos(angle) * 3.5,
            vy: Math.sin(angle) * 3.5,
            life: 180,
          });
          if (e.isBoss) {
            // Boss spreads
            for (let a = -0.3; a <= 0.3; a += 0.15) {
              enemyBullets.push({
                x: e.x, y: e.y + e.height / 2,
                vx: Math.cos(angle + a) * 3.5,
                vy: Math.sin(angle + a) * 3.5,
                life: 180,
              });
            }
          }
        }
      }
    }

    // Out of bounds
    if (e.y > CH + 100) { enemies.splice(i, 1); continue; }
  }
}

function drawEnemy(ctx, e) {
  ctx.save();
  ctx.translate(e.x, e.y);

  // HP bar for heavy/boss
  if (e.maxHp > 3) {
    const barW = e.width + 4;
    const barH = 3;
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-barW / 2, -e.height / 2 - 8, barW, barH);
    ctx.fillStyle = e.hp / e.maxHp > 0.5 ? '#76b900' : '#ff3b3b';
    ctx.fillRect(-barW / 2, -e.height / 2 - 8, barW * (e.hp / e.maxHp), barH);
    // Boss name
    if (e.isBoss) {
      ctx.fillStyle = '#ff3b3b';
      ctx.font = '8px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('BOSS', 0, -e.height / 2 - 14);
    }
  }

  if (e.type === 'scout') {
    // Diamond shape
    ctx.fillStyle = '#0a0a0a';
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 1.5;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 4;
    ctx.beginPath();
    ctx.moveTo(0, -e.height / 2);
    ctx.lineTo(-e.width / 2, 0);
    ctx.lineTo(0, e.height / 2);
    ctx.lineTo(e.width / 2, 0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
  } else if (e.type === 'fighter') {
    ctx.fillStyle = '#0a0a0a';
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 2;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.moveTo(0, -e.height / 2);
    ctx.lineTo(-e.width / 2, e.height / 4);
    ctx.lineTo(-e.width / 4, e.height / 2);
    ctx.lineTo(e.width / 4, e.height / 2);
    ctx.lineTo(e.width / 2, e.height / 4);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Eye
    ctx.fillStyle = e.color;
    ctx.beginPath();
    ctx.arc(0, -2, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  } else if (e.type === 'heavy') {
    ctx.fillStyle = '#0a0a0a';
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.moveTo(-e.width / 3, -e.height / 2);
    ctx.lineTo(-e.width / 2, e.height / 2);
    ctx.lineTo(e.width / 2, e.height / 2);
    ctx.lineTo(e.width / 3, -e.height / 2);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Armor lines
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 1;
    for (let lx = -e.width / 4; lx <= e.width / 4; lx += e.width / 4) {
      ctx.beginPath();
      ctx.moveTo(lx, -e.height / 4);
      ctx.lineTo(lx, e.height / 3);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  } else if (e.isBoss) {
    // Boss — large angular ship
    ctx.fillStyle = '#0a0a0a';
    ctx.strokeStyle = e.color;
    ctx.lineWidth = 3;
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, -e.height / 2);
    ctx.lineTo(-e.width / 2, -e.height / 4);
    ctx.lineTo(-e.width / 3, e.height / 4);
    ctx.lineTo(-e.width / 2, e.height / 2);
    ctx.lineTo(e.width / 2, e.height / 2);
    ctx.lineTo(e.width / 3, e.height / 4);
    ctx.lineTo(e.width / 2, -e.height / 4);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Core
    ctx.fillStyle = '#ff3b3b';
    ctx.shadowColor = '#ff3b3b';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fill();
    // Side cannons
    ctx.fillStyle = '#333';
    ctx.fillRect(-e.width / 2 + 2, -4, 8, 8);
    ctx.fillRect(e.width / 2 - 10, -4, 8, 8);
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

// ─── Enemy Bullets ────────────────
function updateEnemyBullets() {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.y < -20 || b.y > CH + 20 || b.x < -20 || b.x > CW + 20 || b.life <= 0) {
      enemyBullets.splice(i, 1);
    }
  }
}
function drawEnemyBullets(ctx) {
  for (const b of enemyBullets) {
    ctx.fillStyle = '#ff3b3b';
    ctx.shadowColor = '#ff3b3b';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// ─── Power-ups ────────────────────
const powerUps = [];
const POWER_TYPES = ['triple', 'shield', 'rapid'];
function spawnPowerUp(x, y) {
  const type = POWER_TYPES[Math.floor(Math.random() * POWER_TYPES.length)];
  powerUps.push({ x, y, type, vy: 1.5, life: 480, pulse: 0 });
}
function updatePowerUps() {
  for (let i = powerUps.length - 1; i >= 0; i--) {
    const p = powerUps[i];
    p.y += p.vy; p.life--; p.pulse += 0.1;
    if (p.y > CH + 30 || p.life <= 0) { powerUps.splice(i, 1); }
  }
}
function drawPowerUps(ctx) {
  for (const p of powerUps) {
    const alpha = p.life < 60 ? p.life / 60 : 1;
    ctx.globalAlpha = alpha;
    const glow = 10 + Math.sin(p.pulse) * 3;
    ctx.shadowColor = p.type === 'triple' ? '#00d4ff' : p.type === 'shield' ? '#a855f7' : '#ffaa00';
    ctx.shadowBlur = glow;
    ctx.fillStyle = p.type === 'triple' ? '#00d4ff' : p.type === 'shield' ? '#a855f7' : '#ffaa00';
    ctx.beginPath();
    // Diamond shape
    ctx.moveTo(p.x, p.y - 8);
    ctx.lineTo(p.x - 6, p.y);
    ctx.lineTo(p.x, p.y + 8);
    ctx.lineTo(p.x + 6, p.y);
    ctx.closePath();
    ctx.fill();
    // Label
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = '7px monospace';
    ctx.textAlign = 'center';
    const label = p.type === 'triple' ? '3X' : p.type === 'shield' ? 'S' : 'R';
    ctx.fillText(label, p.x, p.y + 3);
  }
  ctx.globalAlpha = 1;
}

// ─── Collision ────────────────────
function rectCollide(a, b) {
  return !(a.x - a.width / 2 > b.x + b.width / 2 ||
           a.x + a.width / 2 < b.x - b.width / 2 ||
           a.y - a.height / 2 > b.y + b.height / 2 ||
           a.y + a.height / 2 < b.y - b.height / 2);
}

function checkCollisions() {
  // Bullets vs enemies
  for (let bi = bullets.length - 1; bi >= 0; bi--) {
    const b = bullets[bi];
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (rectCollide(
        { x: b.x, y: b.y, width: 4, height: 14 },
        { x: e.x, y: e.y, width: e.width, height: e.height }
      )) {
        bullets.splice(bi, 1);
        e.hp--;
        spawnParticles(b.x, b.y, 5, e.color, 1.5, 15);
        beep(600 + e.hp * 50, 0.06, 'square', 0.03);

        if (e.hp <= 0) {
          game.score += e.score * game.combo;
          game.combo++;
          game.comboTimer = 90;
          // Track max combo
          if (game.combo > game.maxCombo) game.maxCombo = game.combo;
          spawnParticles(e.x, e.y, 20, e.color, 3, 25);
          if (e.isBoss) spawnParticles(e.x, e.y, 60, e.color, 5, 40);
          beep(200, 0.15, 'sawtooth', 0.08);
          // Power-up drop chance
          if (Math.random() < 0.25 || e.isBoss) spawnPowerUp(e.x, e.y);
          enemies.splice(ei, 1);
          updateHUD();
        }
        break;
      }
    }
  }

  // Player vs power-ups
  for (let i = powerUps.length - 1; i >= 0; i--) {
    const p = powerUps[i];
    if (rectCollide(player, { x: p.x, y: p.y, width: 14, height: 18 })) {
      activatePowerUp(p.type);
      powerUps.splice(i, 1);
      beep(800, 0.1, 'sine', 0.06);
    }
  }

  // Enemy bullets vs player
  if (player.invincible <= 0) {
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      if (rectCollide(player, { x: b.x, y: b.y, width: 6, height: 6 })) {
        enemyBullets.splice(i, 1);
        hitPlayer(10);
        break;
      }
    }
  }

  // Enemies vs player (ramming)
  if (player.invincible <= 0) {
    for (const e of enemies) {
      if (rectCollide(player, e)) {
        hitPlayer(e.isBoss ? 30 : 15);
        spawnParticles(e.x, e.y, 15, e.color, 3, 20);
        enemies.splice(enemies.indexOf(e), 1);
        break;
      }
    }
  }
}

function activatePowerUp(type) {
  switch (type) {
    case 'triple': player.powerMode = 600; break;
    case 'shield': player.shieldActive = true; setTimeout(() => player.shieldActive = false, 8000); break;
    case 'rapid': player.shootInterval = 5; setTimeout(() => player.shootInterval = 12, 6000); break;
  }
}

function hitPlayer(dmg) {
  if (player.shieldActive) { player.shieldActive = false; beep(300, 0.1, 'triangle', 0.05); return; }
  player.health -= dmg;
  player.invincible = 45;
  spawnParticles(player.x, player.y, 10, '#ff3b3b', 2, 15);
  beep(150, 0.2, 'sawtooth', 0.1);
  updateHUD();
  if (player.health <= 0) {
    player.health = 0;
    spawnParticles(player.x, player.y, 50, '#ff3b3b', 5, 40);
    game.gameOver();
  }
}

// ─── UI Updates ───────────────────
function updateHUD() {
  document.getElementById('score-display').textContent = game.score;
  document.getElementById('wave-display').textContent = game.wave;
  const comboDisplay = document.getElementById('combo-display');
  comboDisplay.textContent = 'x' + game.combo;
  comboDisplay.style.color = game.combo >= 10 ? '#ffaa00' : game.combo >= 5 ? '#00d4ff' : '#666';

  const bar = document.getElementById('health-bar');
  bar.style.width = (player.health / player.maxHealth * 100) + '%';
  if (player.health <= 25) bar.classList.add('critical');
  else bar.classList.remove('critical');
}

// ══════════════════════════════════════
//  PLAYER IDENTITY & LEADERBOARD SYSTEM
// ══════════════════════════════════════

// ─── Player Identity ──────────────
// Each player gets a persistent unique ID (UUID) on first visit.
// Nickname can be changed freely — scores are linked by ID.

function getPlayerId() {
  let id = localStorage.getItem('ts_player_id');
  if (!id) {
    // crypto.randomUUID() available in all modern browsers
    id = typeof crypto !== 'undefined' && crypto.randomUUID
      ? crypto.randomUUID()
      : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
    localStorage.setItem('ts_player_id', id);
  }
  return id;
}

function getPlayerName() {
  return localStorage.getItem('ts_player_name') || 'PILOT';
}

function setPlayerName(name) {
  const trimmed = (name || '').trim();
  localStorage.setItem('ts_player_name', trimmed || 'PILOT');
}

// ─── Leaderboard Data ─────────────
// Stored in localStorage as JSON array:
// [{id, name, score, wave, maxCombo, date}, ...]
// Sorted by score descending. Max 50 entries.

const MAX_LB_ENTRIES = 50;

function loadLeaderboard() {
  try {
    return JSON.parse(localStorage.getItem('ts_leaderboard') || '[]');
  } catch (e) { return []; }
}

function saveLeaderboard(lb) {
  // Sort descending by score
  lb.sort((a, b) => b.score - a.score);
  // Trim to max entries
  if (lb.length > MAX_LB_ENTRIES) lb.length = MAX_LB_ENTRIES;
  localStorage.setItem('ts_leaderboard', JSON.stringify(lb));
}

/**
 * Submit a score to the leaderboard.
 * - If this player ID already has an entry, only update if new score is higher.
 * - Always update nickname (in case player changed it).
 * - Stores wave reached and max combo for context.
 */
function submitScore(score, wave, maxCombo) {
  const lb = loadLeaderboard();
  const pid = getPlayerId();
  const name = getPlayerName();

  const existingIdx = lb.findIndex(e => e.id === pid);

  if (existingIdx >= 0) {
    // Only update if this run beats the player's own previous best
    if (score > lb[existingIdx].score) {
      lb[existingIdx].score = score;
      lb[existingIdx].wave = wave;
      lb[existingIdx].maxCombo = maxCombo;
      lb[existingIdx].date = new Date().toISOString();
    }
    // Always refresh name (in case they changed it)
    lb[existingIdx].name = name;
  } else {
    lb.push({
      id: pid,
      name: name,
      score: score,
      wave: wave,
      maxCombo: maxCombo,
      date: new Date().toISOString()
    });
  }

  saveLeaderboard(lb);
}

// ─── Leaderboard Rendering ────────

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/**
 * Render top-10 leaderboard into a container element.
 * Highlights the current player's row. Shows "your rank" if outside top 10.
 */
function renderLeaderboard(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;

  const lb = loadLeaderboard();
  const pid = getPlayerId();

  if (lb.length === 0) {
    container.innerHTML = '<div class="lb-empty">⚡ 还没有记录，快来挑战吧！</div>';
    return;
  }

  const top10 = lb.slice(0, 10);
  let html = '<table class="lb-table"><thead><tr><th>#</th><th>飞行员</th><th>分数</th><th>波次</th></tr></thead><tbody>';

  top10.forEach((entry, i) => {
    const rank = i + 1;
    let rankClass = '';
    let rankIcon = rank;
    if (rank === 1) { rankClass = 'rank-1'; rankIcon = '🥇'; }
    else if (rank === 2) { rankClass = 'rank-2'; rankIcon = '🥈'; }
    else if (rank === 3) { rankClass = 'rank-3'; rankIcon = '🥉'; }

    const isYou = entry.id === pid;
    const youMarker = isYou ? ' ⭐' : '';

    html += '<tr class="' + (isYou ? 'you' : '') + '">' +
      '<td class="' + rankClass + '">' + rankIcon + '</td>' +
      '<td title="' + escapeHtml(entry.name) + '">' + escapeHtml(entry.name) + youMarker + '</td>' +
      '<td>' + entry.score.toLocaleString() + '</td>' +
      '<td>' + entry.wave + '</td>' +
      '</tr>';
  });

  html += '</tbody></table>';

  // If player is in the list but outside top 10, show their rank
  const playerEntry = lb.find(e => e.id === pid);
  if (playerEntry) {
    const playerRank = lb.findIndex(e => e.id === pid) + 1;
    if (playerRank > 10) {
      html += '<div class="lb-rank-info">' +
        '你的排名: <span style="color:var(--accent-glow)">#' + playerRank + '</span> — ' +
        playerEntry.score.toLocaleString() + ' 分</div>';
    }
  }

  container.innerHTML = html;
}

// ─── Start-screen Leaderboard Toggle ──
let lbExpanded = false;
function toggleStartLB() {
  lbExpanded = !lbExpanded;
  const wrap = document.getElementById('start-lb-container');
  const btn = document.getElementById('lb-toggle');
  if (lbExpanded) {
    wrap.classList.remove('collapsed');
    btn.innerHTML = '🏆 排行榜 ▴';
    renderLeaderboard('start-lb-container');
  } else {
    wrap.classList.add('collapsed');
    btn.innerHTML = '🏆 排行榜 ▾';
  }
}

// ══════════════════════════════════════
//  GAME LOOP & STATE
// ══════════════════════════════════════

// ─── Game Loop ────────────────────
const game = {
  running: false,
  score: 0,
  bestScore: parseInt(localStorage.getItem('ts_best') || '0'),
  wave: 1,
  combo: 1,
  maxCombo: 1,
  comboTimer: 0,
  waveTimer: 0,
  waveSpawned: false,
  frame: 0,

  start() {
    try { initAudio(); } catch(e) {}
    // Save nickname from input
    const nameInput = document.getElementById('nickname-input');
    if (nameInput && nameInput.value.trim()) {
      setPlayerName(nameInput.value.trim());
    }
    // Hide overlays
    document.getElementById('start-overlay').classList.add('hidden');
    document.getElementById('gameover-overlay').classList.add('hidden');
    // Reset start LB toggle
    lbExpanded = false;
    document.getElementById('start-lb-container').classList.add('collapsed');
    document.getElementById('lb-toggle').innerHTML = '🏆 排行榜 ▾';
    this.reset();
    this.running = true;
    document.getElementById('hint').style.display = 'block';
    setTimeout(() => { document.getElementById('hint').style.display = 'none'; }, 4000);
    requestAnimationFrame(() => this.loop());
  },

  reset() {
    this.score = 0;
    this.wave = 1;
    this.combo = 1;
    this.maxCombo = 1;
    this.comboTimer = 0;
    this.waveTimer = 0;
    this.waveSpawned = false;
    this.frame = 0;
    player.x = CW / 2;
    player.y = CH - 100;
    player.health = player.maxHealth;
    player.invincible = 60;
    player.powerMode = 0;
    player.shieldActive = false;
    player.shootInterval = 12;
    enemies.length = 0;
    bullets.length = 0;
    enemyBullets.length = 0;
    particles.length = 0;
    powerUps.length = 0;
    updateHUD();
  },

  restart() {
    document.getElementById('gameover-overlay').classList.add('hidden');
    this.reset();
    this.running = true;
    requestAnimationFrame(() => this.loop());
  },

  gameOver() {
    this.running = false;

    // Update personal best
    if (this.score > this.bestScore) {
      this.bestScore = this.score;
      localStorage.setItem('ts_best', this.bestScore);
    }

    // Submit to leaderboard
    submitScore(this.score, this.wave, this.maxCombo);

    // Update UI
    document.getElementById('final-score').textContent = this.score;
    document.getElementById('best-score').textContent = this.bestScore;
    document.getElementById('gameover-overlay').classList.remove('hidden');

    // Render leaderboard on game over screen
    renderLeaderboard('lb-container');

    beep(100, 0.5, 'sawtooth', 0.1);
  },

  loop() {
    if (!this.running) return;
    this.frame++;
    updateSize();

    // Wave management
    if (!this.waveSpawned) {
      spawnWave();
      this.waveSpawned = true;
      document.getElementById('wave-display').textContent = this.wave;
    }
    // Check if wave cleared
    if (enemies.length === 0 && this.waveSpawned) {
      this.waveTimer++;
      if (this.waveTimer > 120) { // 2 second pause
        this.wave++;
        this.waveSpawned = false;
        this.waveTimer = 0;
        player.health = Math.min(player.health + 10, player.maxHealth);
        updateHUD();
      }
    }

    // Combo decay
    if (this.comboTimer > 0) {
      this.comboTimer--;
      if (this.comboTimer <= 0) { this.combo = 1; this.maxCombo = Math.max(this.maxCombo, this.combo); }
    }

    // Player shooting
    if (player.powerMode > 0) {
      player.powerMode--;
      player.shootTimer--;
      if (player.shootTimer <= 0) {
        player.shootTimer = 5;
        spawnBullet(player.x, player.y - player.height / 2);
        // Triple shot
        spawnBullet(player.x - 8, player.y - player.height / 2 + 6, -Math.PI / 2 - 0.12);
        spawnBullet(player.x + 8, player.y - player.height / 2 + 6, -Math.PI / 2 + 0.12);
      }
    } else {
      player.shootTimer--;
      if (player.shootTimer <= 0) {
        player.shootTimer = player.shootInterval;
        spawnBullet(player.x, player.y - player.height / 2);
      }
    }
    // Invincibility
    if (player.invincible > 0) player.invincible--;

    // Updates
    updateStars();
    updateBullets();
    updateEnemies();
    updateEnemyBullets();
    updatePowerUps();
    updateParticles();
    checkCollisions();

    // ─── Render ──────────────────
    ctx.clearRect(0, 0, CW, CH);

    // Background grid
    ctx.strokeStyle = 'rgba(118,185,0,0.04)';
    ctx.lineWidth = 0.5;
    const gridSize = 40;
    for (let gx = gridSize; gx < CW; gx += gridSize) {
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, CH); ctx.stroke();
    }
    for (let gy = gridSize; gy < CH; gy += gridSize) {
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(CW, gy); ctx.stroke();
    }

    drawStars(ctx);
    drawParticles(ctx);

    // Power-ups
    drawPowerUps(ctx);

    // Bullets
    drawBullets(ctx);
    drawEnemyBullets(ctx);

    // Enemies
    for (const e of enemies) drawEnemy(ctx, e);

    // Player
    drawPlayer(ctx);

    // Vignette
    const vignette = ctx.createRadialGradient(CW / 2, CH / 2, CW * 0.5, CW / 2, CH / 2, CW * 0.9);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, CW, CH);

    // Scanlines effect
    ctx.fillStyle = 'rgba(0,0,0,0.03)';
    for (let sy = 0; sy < CH; sy += 3) {
      ctx.fillRect(0, sy, CW, 1);
    }

    // Power-up indicator
    if (player.powerMode > 0) {
      ctx.fillStyle = '#00d4ff';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('POWER', player.x, player.y - player.height / 2 - 16);
    }
    if (player.shieldActive) {
      ctx.fillStyle = '#a855f7';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('SHIELD', player.x, player.y - player.height / 2 - 16);
    }

    requestAnimationFrame(() => this.loop());
  },
};

// ─── Touch / Mouse Controls ───────
let pointerActive = false;
let pointerX = 0, pointerY = 0;

canvas.addEventListener('mousedown', (e) => {
  pointerActive = true;
  const rect = canvas.getBoundingClientRect();
  pointerX = e.clientX - rect.left;
  pointerY = e.clientY - rect.top;
});
canvas.addEventListener('mousemove', (e) => {
  if (!pointerActive) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = CW / rect.width;
  const scaleY = CH / rect.height;
  player.x = (e.clientX - rect.left) * scaleX;
  player.y = (e.clientY - rect.top) * scaleY;
  // Clamp
  player.x = Math.max(player.width / 2, Math.min(CW - player.width / 2, player.x));
  player.y = Math.max(player.height / 2, Math.min(CH - player.height / 2, player.y));
});
canvas.addEventListener('mouseup', () => { pointerActive = false; });

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  pointerActive = true;
  const rect = canvas.getBoundingClientRect();
  pointerX = e.touches[0].clientX - rect.left;
  pointerY = e.touches[0].clientY - rect.top;
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!pointerActive) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = CW / rect.width;
  const scaleY = CH / rect.height;
  player.x = (e.touches[0].clientX - rect.left) * scaleX;
  player.y = (e.touches[0].clientY - rect.top) * scaleY;
  player.x = Math.max(player.width / 2, Math.min(CW - player.width / 2, player.x));
  player.y = Math.max(player.height / 2, Math.min(CH - player.height / 2, player.y));
}, { passive: false });
canvas.addEventListener('touchend', () => { pointerActive = false; });

// Keyboard (desktop)
window.addEventListener('keydown', (e) => {
  const speed = player.speed;
  switch (e.key) {
    case 'ArrowLeft': case 'a': player.x -= speed; break;
    case 'ArrowRight': case 'd': player.x += speed; break;
    case 'ArrowUp': case 'w': player.y -= speed; break;
    case 'ArrowDown': case 's': player.y += speed; break;
    case ' ': e.preventDefault(); break;
  }
  player.x = Math.max(player.width / 2, Math.min(CW - player.width / 2, player.x));
  player.y = Math.max(player.height / 2, Math.min(CH - player.height / 2, player.y));
});

// Init
initStars();
updateHUD();
document.getElementById('best-score').textContent = game.bestScore;

// Pre-fill nickname from previous session
document.getElementById('nickname-input').value = getPlayerName();

// Show current player identity on start screen (small hint below name input)
const nicknameInput = document.getElementById('nickname-input');
const playerIdHint = document.createElement('div');
playerIdHint.style.cssText = 'font-size:8px;color:#333;text-align:center;margin-top:-14px;margin-bottom:10px;letter-spacing:1px;';
playerIdHint.textContent = 'ID: ' + getPlayerId().slice(0, 8) + '...';
nicknameInput.parentNode.insertBefore(playerIdHint, nicknameInput.nextSibling);
</script>
</body>
