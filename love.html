<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>绚丽多彩爱心</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  .hint {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    color: rgba(255,255,255,0.5); font-family: "Microsoft YaHei", sans-serif;
    font-size: 14px; letter-spacing: 2px; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">移动鼠标试试 · 点击迸发爱心</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// 鼠标位置
const mouse = { x: W/2, y: H/2 };
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('touchmove', e => {
  if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
}, { passive: true });

// 爱心参数方程上的点
function heartPoint(t, scale) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
  return { x: x * scale, y: y * scale };
}

// 粒子
class Particle {
  constructor(targetX, targetY) {
    this.targetX = targetX;
    this.targetY = targetY;
    // 随机起始位置（屏幕外）
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.max(W, H);
    this.x = W/2 + Math.cos(angle) * dist;
    this.y = H/2 + Math.sin(angle) * dist;
    this.vx = 0;
    this.vy = 0;
    this.size = 1 + Math.random() * 2.5;
    // HSL 色相基于目标位置形成彩虹
    const hue = (targetX / W * 360 + targetY / H * 120) % 360;
    this.hue = hue;
    this.alpha = 0;
  }
  update() {
    // 向目标移动
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    this.vx = this.vx * 0.88 + dx * 0.008;
    this.vy = this.vy * 0.88 + dy * 0.008;
    // 鼠标排斥
    const mdx = this.x - mouse.x;
    const mdy = this.y - mouse.y;
    const md = Math.sqrt(mdx*mdx + mdy*mdy);
    if (md < 120) {
      const force = (120 - md) / 120 * 3;
      this.vx += (mdx / md) * force;
      this.vy += (mdy / md) * force;
    }
    this.x += this.vx;
    this.y += this.vy;
    this.alpha = Math.min(1, this.alpha + 0.03);
  }
  draw() {
    // 色相随时间漂移，更绚丽
    const hue = (this.hue + performance.now() * 0.03) % 360;
    ctx.beginPath();
    ctx.fillStyle = `hsla(${hue}, 100%, 65%, ${this.alpha})`;
    ctx.shadowBlur = 15;
    ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

let particles = [];
let burstParticles = [];

// 构建爱心形状粒子
function buildHeart() {
  particles = [];
  const scale = Math.min(W, H) / 45;
  const cx = W / 2;
  const cy = H / 2;
  // 外层轮廓
  for (let t = 0; t < Math.PI * 2; t += 0.01) {
    const p = heartPoint(t, scale);
    particles.push(new Particle(cx + p.x, cy + p.y));
  }
  // 内部填充
  for (let t = 0; t < Math.PI * 2; t += 0.04) {
    const p = heartPoint(t, scale * 0.7);
    particles.push(new Particle(cx + p.x, cy + p.y));
  }
  for (let t = 0; t < Math.PI * 2; t += 0.08) {
    const p = heartPoint(t, scale * 0.4);
    particles.push(new Particle(cx + p.x, cy + p.y));
  }
}
buildHeart();
window.addEventListener('resize', buildHeart);

// 点击迸发爱心
class BurstParticle {
  constructor(x, y) {
    this.x = x; this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 5;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed - 1;
    this.life = 1;
    this.size = 1 + Math.random() * 3;
    this.hue = Math.random() * 360;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.05;
    this.vx *= 0.99;
    this.life -= 0.012;
  }
  draw() {
    if (this.life <= 0) return;
    ctx.beginPath();
    ctx.fillStyle = `hsla(${this.hue}, 100%, 65%, ${this.life})`;
    ctx.shadowBlur = 20;
    ctx.shadowColor = `hsl(${this.hue}, 100%, 60%)`;
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fill();
  }
}

window.addEventListener('click', e => {
  for (let i = 0; i < 80; i++) {
    burstParticles.push(new BurstParticle(e.clientX, e.clientY));
  }
});

function animate() {
  // 拖尾效果
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.fillRect(0, 0, W, H);

  for (const p of particles) {
    p.update();
    p.draw();
  }

  burstParticles = burstParticles.filter(p => p.life > 0);
  for (const p of burstParticles) {
    p.update();
    p.draw();
  }

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
