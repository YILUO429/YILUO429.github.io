<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>废墟拾光</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            max-height: 900px;
            background: #2a2a3e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        .ui-screen.hidden {
            display: none;
        }

        .game-title {
            font-size: 2.8em;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        .game-subtitle {
            color: #888;
            font-size: 1em;
            margin-bottom: 30px;
        }

        .rules {
            color: #ccc;
            text-align: left;
            max-width: 360px;
            margin: 20px 0;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .rules h3 {
            color: #ffd700;
            margin-bottom: 10px;
            text-align: center;
        }

        .rules ul {
            list-style: none;
            padding-left: 0;
        }

        .rules li {
            margin: 6px 0;
            padding-left: 20px;
            position: relative;
        }

        .rules li::before {
            content: "•";
            color: #ffd700;
            position: absolute;
            left: 0;
        }

        .mode-selector {
            display: flex;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-btn {
            padding: 12px 20px;
            border: 2px solid #ffd700;
            background: transparent;
            color: #ffd700;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .mode-btn:hover, .mode-btn.active {
            background: #ffd700;
            color: #1a1a2e;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .start-btn {
            padding: 15px 50px;
            font-size: 1.3em;
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 20px;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.6);
        }

        .score-display {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #ffd700;
            font-size: 1.2em;
            font-weight: bold;
            z-index: 5;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
        }

        .high-score {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #888;
            font-size: 0.9em;
            z-index: 5;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
        }

        .shield-indicator {
            position: absolute;
            top: 40px;
            left: 10px;
            color: #00ff88;
            font-size: 0.9em;
            z-index: 5;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
        }

        .final-score {
            font-size: 2em;
            color: #ffd700;
            margin: 15px 0;
        }

        .result-message {
            font-size: 1.5em;
            margin: 10px 0;
        }

        .result-message.success {
            color: #00ff88;
        }

        .result-message.fail {
            color: #ff6b6b;
        }

        .new-record {
            color: #ffd700;
            font-size: 1.3em;
            animation: pulse 1s infinite;
            margin: 10px 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .best-score {
            color: #888;
            font-size: 1em;
            margin: 5px 0;
        }

        .restart-btn {
            padding: 12px 40px;
            font-size: 1.1em;
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 25px;
            font-weight: bold;
        }

        .back-btn {
            padding: 10px 30px;
            font-size: 1em;
            background: transparent;
            color: #888;
            border: 1px solid #888;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }

        .stats {
            color: #ccc;
            margin: 15px 0;
            line-height: 1.8;
        }

        .control-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85em;
            z-index: 5;
            text-align: center;
        }

        @media (max-width: 500px) {
            #game-container {
                border-radius: 0;
                max-width: 100%;
                max-height: 100%;
            }

            .game-title {
                font-size: 2.2em;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="score-display">得分: <span id="currentScore">0</span>/<span id="targetScore">30</span></div>
        <div class="high-score">最高分: <span id="highScore">0</span></div>
        <div class="shield-indicator" id="shieldIndicator" style="display: none;">🛡️ 护盾</div>
        <div class="control-hint" id="controlHint"></div>

        <div id="startScreen" class="ui-screen">
            <h1 class="game-title">废墟拾光</h1>
            <p class="game-subtitle">轻度末世收集 · 单手即可游玩</p>
            
            <div class="rules">
                <h3>游戏规则</h3>
                <ul>
                    <li>收集金色能量晶石，累计分数通关</li>
                    <li>躲开腐蚀黑雾和高空落石，触碰即败</li>
                    <li>金色晶石：+1分，闪耀大晶：+5分</li>
                    <li>护盾晶片：抵挡一次黑雾撞击</li>
                    <li>每开局3次，免费赠送一次护盾</li>
                </ul>
            </div>

            <div>
                <p style="color: #ccc; margin-bottom: 10px;">选择游戏模式</p>
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="normal">标准模式</button>
                    <button class="mode-btn" data-mode="speed">极速模式</button>
                    <button class="mode-btn" data-mode="collection">收集专项</button>
                </div>
            </div>

            <button class="start-btn" id="startButton">开始游戏</button>
        </div>

        <div id="gameOverScreen" class="ui-screen hidden">
            <h2 id="resultTitle" class="result-message"></h2>
            <div id="newRecordBadge" class="new-record hidden">🏆 新纪录！</div>
            <div class="final-score">本局得分: <span id="finalScore">0</span></div>
            <div class="best-score">历史最高分: <span id="finalBestScore">0</span></div>
            <div class="stats" id="gameStats"></div>
            <button class="restart-btn" id="restartButton">再来一局</button>
            <button class="back-btn" id="backButton">返回主页</button>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const startScreen = document.getElementById('startScreen');
            const gameOverScreen = document.getElementById('gameOverScreen');
            const startButton = document.getElementById('startButton');
            const restartButton = document.getElementById('restartButton');
            const backButton = document.getElementById('backButton');
            const currentScoreEl = document.getElementById('currentScore');
            const targetScoreEl = document.getElementById('targetScore');
            const highScoreEl = document.getElementById('highScore');
            const finalScoreEl = document.getElementById('finalScore');
            const finalBestScoreEl = document.getElementById('finalBestScore');
            const resultTitleEl = document.getElementById('resultTitle');
            const newRecordBadge = document.getElementById('newRecordBadge');
            const gameStatsEl = document.getElementById('gameStats');
            const shieldIndicator = document.getElementById('shieldIndicator');
            const controlHint = document.getElementById('controlHint');
            const modeButtons = document.querySelectorAll('.mode-btn');

            let width = canvas.width = canvas.clientWidth;
            let height = canvas.height = canvas.clientHeight;

            const GAME_MODES = {
                normal: { name: '标准模式', targetScore: 30, speedMultiplier: 1, timeLimit: 0, hasFog: true },
                speed: { name: '极速模式', targetScore: 20, speedMultiplier: 1.5, timeLimit: 0, hasFog: true },
                collection: { name: '收集专项', targetScore: 40, speedMultiplier: 1, timeLimit: 80, hasFog: false }
            };

            let currentMode = 'normal';
            let gameState = 'start'; // start, playing, gameover
            let score = 0;
            let highScore = parseInt(localStorage.getItem('ruinLightHighScore') || '0');
            let gameTime = 0;
            let startTime = 0;
            let gamesPlayed = parseInt(localStorage.getItem('ruinLightGamesPlayed') || '0');

            highScoreEl.textContent = highScore;

            const player = {
                x: 80,
                y: height / 2,
                radius: 18,
                velocityY: 0,
                hasShield: false,
                isPressing: false
            };

            let crystals = [];
            let bigCrystals = [];
            let shieldChips = [];
            let fogs = [];
            let fallingRocks = [];

            let lastCrystalTime = 0;
            let lastBigCrystalTime = 0;
            let lastShieldChipTime = 0;
            let lastFogTime = 0;
            let lastRockTime = 0;

            const PHYSICS = {
                lift: -0.8,
                gravity: 0.35,
                terminalVelocity: 8
            };

            function resizeCanvas() {
                width = canvas.width = canvas.clientWidth;
                height = canvas.height = canvas.clientHeight;
            }

            window.addEventListener('resize', resizeCanvas);

            function getDifficultyMultiplier() {
                const modeCfg = GAME_MODES[currentMode];
                let diff = 1;
                if (score <= 20) diff = 1;
                else if (score <= 50) diff = 2;
                else diff = 3;
                return diff * modeCfg.speedMultiplier;
            }

            function getBackgroundColor() {
                let r, g, b;
                if (score <= 20) {
                    r = 42 + (score / 20) * 20;
                    g = 42 + (score / 20) * 10;
                    b = 62 + (score / 20) * 10;
                } else if (score <= 50) {
                    const t = (score - 20) / 30;
                    r = 62 + t * 60;
                    g = 52 - t * 12;
                    b = 72 - t * 22;
                } else {
                    const t = Math.min((score - 50) / 50, 1);
                    r = 122 + t * 30;
                    g = 40 - t * 20;
                    b = 50 - t * 20;
                }
                return `rgb(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)})`;
            }

            function getSpawnInterval(type) {
                const diff = getDifficultyMultiplier();
                const intervals = {
                    crystal: 600 / diff,
                    bigCrystal: 3000 / diff,
                    shieldChip: 8000 / diff,
                    fog: 2500 / diff,
                    rock: 4000 / diff
                };
                if (diff >= 3) {
                    intervals.fog = 1200 / diff;
                    intervals.rock = 1500 / diff;
                } else if (diff >= 2) {
                    intervals.fog = 1800 / diff;
                    intervals.rock = 2000 / diff;
                }
                return intervals[type];
            }

            function spawnCrystal() {
                const crystal = {
                    x: width + 20,
                    y: Math.random() * (height - 80) + 40,
                    radius: 10,
                    speed: 2.5 * getDifficultyMultiplier(),
                    collected: false
                };
                crystals.push(crystal);
            }

            function spawnBigCrystal() {
                const crystal = {
                    x: width + 30,
                    y: Math.random() * (height - 120) + 60,
                    radius: 18,
                    speed: 2.2 * getDifficultyMultiplier(),
                    collected: false,
                    pulse: 0
                };
                bigCrystals.push(crystal);
            }

            function spawnShieldChip() {
                const chip = {
                    x: width + 20,
                    y: Math.random() * (height - 80) + 40,
                    radius: 12,
                    speed: 2.3 * getDifficultyMultiplier(),
                    collected: false
                };
                shieldChips.push(chip);
            }

            function spawnFog() {
                if (!GAME_MODES[currentMode].hasFog) return;
                
                const fog = {
                    x: width + 20,
                    y: Math.random() * (height - 100),
                    width: 40 + Math.random() * 60,
                    height: 60 + Math.random() * 80,
                    speed: (1.2 + Math.random() * 1.2) * getDifficultyMultiplier()
                };
                if (Math.random() > 0.7 && fogs.length > 0) {
                    fog.y = fogs[fogs.length - 1].y + (Math.random() > 0.5 ? -80 : 80);
                    fog.y = Math.max(0, Math.min(height - fog.height, fog.y));
                }
                fogs.push(fog);
            }

            function spawnRock() {
                return {
                    x: Math.random() * (width - 60) + 30,
                    y: -40,
                    radius: 15 + Math.random() * 15,
                    speed: (4 + Math.random() * 3) * getDifficultyMultiplier()
                };
            }

            function checkCollisionCircle(c1x, c1y, r1, c2x, c2y, r2) {
                const dx = c1x - c2x;
                const dy = c1y - c2y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                return dist < r1 + r2;
            }

            function checkCollisionCircleRect(cx, cy, cr, rx, ry, rw, rh) {
                const closestX = Math.max(rx, Math.min(cx, rx + rw));
                const closestY = Math.max(ry, Math.min(cy, ry + rh));
                const dx = cx - closestX;
                const dy = cy - closestY;
                return (dx * dx + dy * dy) < (cr * cr);
            }

            function giveFreeShieldIfNeeded() {
                if ((gamesPlayed + 1) % 3 === 0 && !player.hasShield) {
                    player.hasShield = true;
                    shieldIndicator.style.display = 'block';
                }
            }

            function startGame() {
                score = 0;
                gameTime = 0;
                crystals = [];
                bigCrystals = [];
                shieldChips = [];
                fogs = [];
                fallingRocks = [];
                lastCrystalTime = performance.now();
                lastBigCrystalTime = performance.now();
                lastShieldChipTime = performance.now();
                lastFogTime = performance.now();
                lastRockTime = performance.now();

                player.x = width * 0.15;
                player.y = height / 2;
                player.velocityY = 0;
                player.hasShield = false;
                giveFreeShieldIfNeeded();

                currentScoreEl.textContent = score;
                targetScoreEl.textContent = GAME_MODES[currentMode].targetScore;
                updateShieldIndicator();

                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                gameState = 'playing';
                startTime = performance.now();

                if ('ontouchstart' in window) {
                    controlHint.textContent = '按住屏幕上浮，松开下落';
                } else {
                    controlHint.textContent = '长按空格上浮，松开下落';
                }
            }

            function updateShieldIndicator() {
                if (player.hasShield) {
                    shieldIndicator.style.display = 'block';
                } else {
                    shieldIndicator.style.display = 'none';
                }
            }

            function gameOver(isVictory) {
                gameState = 'gameover';
                gamesPlayed++;
                localStorage.setItem('ruinLightGamesPlayed', gamesPlayed.toString());

                const duration = ((performance.now() - startTime) / 1000).toFixed(1);
                let isNewRecord = false;

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('ruinLightHighScore', highScore.toString());
                    isNewRecord = true;
                }

                highScoreEl.textContent = highScore;
                finalScoreEl.textContent = score;
                finalBestScoreEl.textContent = highScore;

                if (isVictory) {
                    resultTitleEl.textContent = '🎉 通关成功！';
                    resultTitleEl.className = 'result-message success';
                } else {
                    resultTitleEl.textContent = '💀 游戏结束';
                    resultTitleEl.className = 'result-message fail';
                }

                if (isNewRecord) {
                    newRecordBadge.classList.remove('hidden');
                } else {
                    newRecordBadge.classList.add('hidden');
                }

                const modeCfg = GAME_MODES[currentMode];
                let statsHtml = `模式：${modeCfg.name}<br>`;
                statsHtml += `用时：${duration}秒<br>`;
                statsHtml += `收集：${score} 个晶石单位`;
                gameStatsEl.innerHTML = statsHtml;

                controlHint.textContent = '';
                setTimeout(() => {
                    gameOverScreen.classList.remove('hidden');
                }, 300);
            }

            function update(deltaTime) {
                if (gameState !== 'playing') return;

                gameTime += deltaTime;
                const now = performance.now();

                const modeCfg = GAME_MODES[currentMode];
                if (modeCfg.timeLimit > 0 && gameTime / 1000 > modeCfg.timeLimit) {
                    if (score >= modeCfg.targetScore) {
                        gameOver(true);
                    } else {
                        gameOver(false);
                    }
                    return;
                }

                if (score >= modeCfg.targetScore) {
                    gameOver(true);
                    return;
                }

                if (player.isPressing) {
                    player.velocityY += PHYSICS.lift;
                } else {
                    player.velocityY += PHYSICS.gravity;
                }

                player.velocityY = Math.max(-PHYSICS.terminalVelocity, Math.min(PHYSICS.terminalVelocity, player.velocityY));
                player.y += player.velocityY;

                if (player.y - player.radius < 0) {
                    player.y = player.radius;
                    player.velocityY = 0;
                }
                if (player.y + player.radius > height) {
                    player.y = height - player.radius;
                    player.velocityY = 0;
                }

                if (now - lastCrystalTime > getSpawnInterval('crystal')) {
                    spawnCrystal();
                    lastCrystalTime = now;
                }

                if (now - lastBigCrystalTime > getSpawnInterval('bigCrystal')) {
                    spawnBigCrystal();
                    lastBigCrystalTime = now;
                }

                if (now - lastShieldChipTime > getSpawnInterval('shieldChip') && !player.hasShield) {
                    if (Math.random() < 0.3) {
                        spawnShieldChip();
                        lastShieldChipTime = now;
                    }
                }

                if (now - lastFogTime > getSpawnInterval('fog') && GAME_MODES[currentMode].hasFog) {
                    if (fogs.length < 3 + getDifficultyMultiplier()) {
                        spawnFog();
                        lastFogTime = now;
                    }
                }

                if (now - lastRockTime > getSpawnInterval('rock')) {
                    fallingRocks.push(spawnRock());
                    lastRockTime = now;
                }

                crystals.forEach(crystal => {
                    crystal.x -= crystal.speed;
                    if (!crystal.collected && checkCollisionCircle(player.x, player.y, player.radius, crystal.x, crystal.y, crystal.radius)) {
                        crystal.collected = true;
                        score += 1;
                        currentScoreEl.textContent = score;
                    }
                });
                crystals = crystals.filter(c => c.x > -c.radius * 2 && !c.collected);

                bigCrystals.forEach(crystal => {
                    crystal.x -= crystal.speed;
                    crystal.pulse += 0.1;
                    if (!crystal.collected && checkCollisionCircle(player.x, player.y, player.radius, crystal.x, crystal.y, crystal.radius)) {
                        crystal.collected = true;
                        score += 5;
                        currentScoreEl.textContent = score;
                    }
                });
                bigCrystals = bigCrystals.filter(c => c.x > -c.radius * 2 && !c.collected);

                shieldChips.forEach(chip => {
                    chip.x -= chip.speed;
                    if (!chip.collected && checkCollisionCircle(player.x, player.y, player.radius, chip.x, chip.y, chip.radius)) {
                        chip.collected = true;
                        player.hasShield = true;
                        updateShieldIndicator();
                    }
                });
                shieldChips = shieldChips.filter(c => c.x > -c.radius * 2 && !c.collected);

                fogs.forEach(fog => {
                    fog.x -= fog.speed;
                });
                fogs = fogs.filter(f => f.x > -f.width);

                fallingRocks.forEach(rock => {
                    rock.y += rock.speed;
                });
                fallingRocks = fallingRocks.filter(r => r.y < height + r.radius);

                for (const rock of fallingRocks) {
                    if (checkCollisionCircle(player.x, player.y, player.radius, rock.x, rock.y, rock.radius)) {
                        gameOver(false);
                        return;
                    }
                }

                for (const fog of fogs) {
                    if (checkCollisionCircleRect(player.x, player.y, player.radius, fog.x, fog.y, fog.width, fog.height)) {
                        if (player.hasShield) {
                            player.hasShield = false;
                            updateShieldIndicator();
                            fogs = fogs.filter(f => f !== fog);
                        } else {
                            gameOver(false);
                            return;
                        }
                    }
                }
            }

            function draw() {
                ctx.fillStyle = getBackgroundColor();
                ctx.fillRect(0, 0, width, height);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.lineWidth = 1;
                for (let i = 0; i < width; i += 40) {
                    ctx.beginPath();
                    ctx.moveTo(i, 0);
                    ctx.lineTo(i, height);
                    ctx.stroke();
                }

                fogs.forEach(fog => {
                    const gradient = ctx.createLinearGradient(fog.x, fog.y, fog.x + fog.width, fog.y + fog.height);
                    gradient.addColorStop(0, 'rgba(80, 0, 120, 0.6)');
                    gradient.addColorStop(1, 'rgba(80, 0, 120, 0.8)');
                    ctx.fillStyle = gradient;
                    const r = 8, x = fog.x, y = fog.y, w = fog.width, h = fog.height;
                    ctx.beginPath();
                    ctx.moveTo(x + r, y);
                    ctx.lineTo(x + w - r, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                    ctx.lineTo(x + w, y + h - r);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    ctx.lineTo(x + r, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                    ctx.lineTo(x, y + r);
                    ctx.quadraticCurveTo(x, y, x + r, y);
                    ctx.closePath();
                    ctx.fill();
                });

                fallingRocks.forEach(rock => {
                    ctx.fillStyle = '#555555';
                    ctx.beginPath();
                    ctx.arc(rock.x, rock.y, rock.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#777777';
                    ctx.beginPath();
                    ctx.arc(rock.x - 3, rock.y - 3, rock.radius * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                });

                crystals.forEach(crystal => {
                    const gradient = ctx.createRadialGradient(crystal.x, crystal.y, 0, crystal.x, crystal.y, crystal.radius);
                    gradient.addColorStop(0, '#fff2cc');
                    gradient.addColorStop(0.5, '#ffd700');
                    gradient.addColorStop(1, '#b8860b');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(crystal.x, crystal.y, crystal.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffecb3';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });

                bigCrystals.forEach(crystal => {
                    const pulseSize = Math.sin(crystal.pulse) * 2;
                    const r = crystal.radius + pulseSize;
                    const gradient = ctx.createRadialGradient(crystal.x, crystal.y, 0, crystal.x, crystal.y, r);
                    gradient.addColorStop(0, '#ffffe0');
                    gradient.addColorStop(0.5, '#ffd700');
                    gradient.addColorStop(1, '#ff8c00');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(crystal.x, crystal.y, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                });

                shieldChips.forEach(chip => {
                    ctx.fillStyle = 'rgba(0, 255, 136, 0.3)';
                    ctx.beginPath();
                    ctx.arc(chip.x, chip.y, chip.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#00ff88';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.fillStyle = '#00ff88';
                    ctx.beginPath();
                    ctx.arc(chip.x, chip.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                });

                if (player.hasShield) {
                    ctx.strokeStyle = 'rgba(0, 255, 136, 0.6)';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, player.radius + 8, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.fillStyle = '#e0e0e0';
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(player.x - 6, player.y - 4, 3, 0, Math.PI * 2);
                ctx.arc(player.x + 6, player.y - 4, 3, 0, Math.PI * 2);
                ctx.fill();

                requestAnimationFrame(gameLoop);
            }

            function gameLoop() {
                const now = performance.now();
                const deltaTime = now - (gameLoop.lastTime || now);
                gameLoop.lastTime = now;

                update(deltaTime);
                draw();
            }
            gameLoop.lastTime = performance.now();

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (gameState === 'playing') {
                    player.isPressing = true;
                }
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (gameState === 'playing') {
                    player.isPressing = false;
                }
            }, { passive: false });

            canvas.addEventListener('mousedown', (e) => {
                if (gameState === 'playing') {
                    player.isPressing = true;
                }
            });

            canvas.addEventListener('mouseup', (e) => {
                if (gameState === 'playing') {
                    player.isPressing = false;
                }
            });

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    if (gameState === 'playing') {
                        player.isPressing = true;
                    }
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    if (gameState === 'playing') {
                        player.isPressing = false;
                    }
                }
            });

            modeButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    modeButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentMode = btn.dataset.mode;
                    targetScoreEl.textContent = GAME_MODES[currentMode].targetScore;
                });
            });

            startButton.addEventListener('click', startGame);
            restartButton.addEventListener('click', startGame);
            backButton.addEventListener('click', () => {
                gameOverScreen.classList.add('hidden');
                startScreen.classList.remove('hidden');
                controlHint.textContent = '';
                gameState = 'start';
            });

            resizeCanvas();
            requestAnimationFrame(gameLoop);
        })();
    </script>
</body>
</html>
